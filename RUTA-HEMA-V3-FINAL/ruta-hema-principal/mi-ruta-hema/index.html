<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#164e57">
<title>Mi Pasaporte Ruta Hema</title>
<style>
:root{--ink:#17363a;--teal:#164e57;--teal2:#1f7a78;--paper:#fffdf6;--cream:#f4edda;--line:#d8cfba;--blue:#245d91;--mint:#dff3e9;--amber:#a86609;--amber-bg:#fff4cf;--red:#a72d42;--accent:#e86f51;--shadow:0 14px 38px #16363a1c}*{box-sizing:border-box}body{margin:0;background:#e9efeb;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 10%,#fff9 0 2px,transparent 3px),linear-gradient(135deg,#ffffff5c,transparent 48%);background-size:28px 28px,100% 100%}header{position:relative;background:linear-gradient(125deg,#103f49,#1c716e);color:#fff;padding:20px max(18px,calc((100% - 900px)/2));display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid #dfba64}.brand{font-weight:900;font-size:20px;letter-spacing:.04em}.brand small{display:block;font-weight:500;font-size:12px;opacity:.78;letter-spacing:0}.demo{border:1px solid #ffffff70;border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800}main{position:relative;max-width:900px;margin:auto;padding:24px 16px 70px}.passport{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;margin:15px 0;box-shadow:var(--shadow);position:relative;overflow:hidden}.passport:after{content:"RUTA HEMA";position:absolute;right:-22px;bottom:12px;transform:rotate(-12deg);font-weight:900;font-size:31px;color:#164e5709;border:4px double #164e570d;border-radius:9px;padding:4px 12px}.card{background:#fff;border:1px solid #dce5e2;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 15px #113b400d}h1{font-size:29px;margin:0 0 6px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.5}.muted{color:#61777a;font-size:14px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:850;color:var(--teal2)}.identity{display:grid;grid-template-columns:92px 1fr auto;gap:18px;align-items:center}.photo{width:92px;height:108px;border:2px solid var(--teal);border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,var(--mint),#fff);font-size:46px}.code{font:900 30px ui-monospace,Consolas,monospace;letter-spacing:.07em}.stamp{width:94px;height:94px;border:3px double var(--accent);color:var(--accent);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:900;text-transform:uppercase;transform:rotate(-8deg)}.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip,.tag{display:inline-flex;align-items:center;border-radius:99px;background:#e9f1fc;color:var(--blue);padding:5px 10px;font-size:12px;font-weight:750}.coin{background:#fff1bd;color:#795200}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.hero{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border:0}.hero .eyebrow{color:#c8fff4}.step{font-size:24px;font-weight:850;margin:7px 0}.progress{height:10px;background:#ffffff42;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#f4cc70;border-radius:9px}.appointment{display:grid;grid-template-columns:46px 1fr;gap:12px}.icon{font-size:24px;background:var(--mint);border-radius:12px;display:grid;place-items:center;height:46px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button,.btn{appearance:none;border:0;border-radius:11px;padding:12px 15px;background:var(--teal);color:#fff;font:750 14px inherit;cursor:pointer;text-align:center;text-decoration:none}.secondary{background:#e8f0f0;color:var(--teal)}.outline{background:#fff;border:1px solid #bfd0cf;color:var(--teal)}.amber{background:var(--amber-bg);border-color:#efcf7d}.route{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:9px}.route li{position:relative;padding:12px 12px 12px 48px;border:1px dashed #c9d5cf;border-radius:12px;background:#fff}.route li:before{content:'○';position:absolute;left:14px;top:11px;font-size:22px;color:#95aaaa}.route li.done:before{content:'✓';font-size:14px;color:#fff;background:#15806f;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}.route li.current{border:2px solid #d6a948;background:#fffae9}.route li.current:before{content:'●';color:#d09224}.library{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.media{border:1px solid #dce5e2;border-radius:14px;padding:14px;background:#fff;min-height:155px;display:flex;flex-direction:column}.media .cover{height:64px;border-radius:10px;background:linear-gradient(125deg,#dff3e9,#e9f1fc);display:grid;place-items:center;font-size:30px;margin-bottom:11px}.media p{font-size:12px;margin:0 0 12px;color:#61777a}.media button{margin-top:auto;width:100%;padding:9px}.notice{padding:11px 14px;background:#e9f1fc;color:#194d83;border-radius:10px;font-size:13px}.news{padding:12px 0;border-bottom:1px solid #e2e8e6;font-size:14px}.news:last-child{border:0}.risk{background:var(--amber-bg);border:1px solid #e5bd52}.risk strong{color:#815500}.parent-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.control{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #dce5e2;border-radius:12px;padding:12px}.control input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal)}select,textarea,input[type=text],input[type=number],input[type=password]{font:inherit;width:100%;border:1px solid #b8caca;border-radius:10px;padding:11px;margin:6px 0;background:#fff}.modal{position:fixed;inset:0;background:#102c30a0;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.sheet{background:var(--paper);border-radius:20px;width:100%;max-width:620px;max-height:90vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}.choices{display:grid;gap:8px}.choice{background:#fff;border:1px solid #c7d5d2;color:var(--ink);text-align:left}.choice.selected{outline:3px solid #8ed6c6;border-color:var(--teal)}.question{padding:14px 0;border-bottom:1px solid #e6e0d3}.question select{margin-top:7px}.video-player{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(145deg,#123e48,#226e73);color:#fff;display:grid;place-items:center;padding:24px;text-align:center;position:relative;overflow:hidden}.video-player:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#ffffff24 0 4px,transparent 5px);background-size:32px 32px}.video-player>div{position:relative}.play{display:grid;place-items:center;margin:0 auto 12px;width:58px;height:58px;border-radius:50%;background:#fff;color:var(--teal);font-size:25px}.video-progress{height:6px;background:#ffffff40;border-radius:10px;margin-top:18px;overflow:hidden}.video-progress i{display:block;height:100%;width:0;background:#f3cc73;transition:width 2.5s linear}.video-player.playing .video-progress i{width:100%}#login{max-width:460px;margin:45px auto}@media(max-width:720px){.grid,.identity{grid-template-columns:1fr}.identity{text-align:center}.photo,.stamp{margin:auto}.library,.parent-grid{grid-template-columns:1fr}.buttons{display:grid}.passport,.card{padding:17px}header{padding:16px}.code{font-size:25px}}
</style>
</head>
<body>
<header><div class="brand">MI PASAPORTE RUTA HEMA<small>Bitácora para pacientes y familias</small></div><span class="demo">DEMO LOCAL</span></header>
<main id="app"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="../shared/ruta-hema-data.js"></script>
<script>
'use strict';
const phases=['Ingreso / referencia','Evaluación y diagnóstico','Inicio del tratamiento','Hospitalización','Alta hospitalaria','Seguimiento ambulatorio','Control / ciclo de tratamiento','Monitoreo de continuidad','Intervención ante inasistencia','Coordinación con Servicio Social','Reincorporación al seguimiento','Cierre / seguimiento programado'];
const videos=[
  {id:'antes',icon:'🎒',title:'Antes de mi tratamiento',text:'Qué llevar, quién te acompañará y cómo prepararte con calma.',slides:['Hoy conocerás tu siguiente paso.','Tu equipo te explicará el procedimiento.','Puedes preguntar y decir cómo te sientes.']},
  {id:'durante',icon:'🏥',title:'Durante mi visita',text:'Un recorrido sencillo por la clínica de día y sus momentos.',slides:['Registra tu llegada.','Conoce al equipo que te acompañará.','Descansa y avisa si necesitas ayuda.']},
  {id:'despues',icon:'🏠',title:'Después del tratamiento',text:'Recordatorios generales para volver a casa y mantener contacto.',slides:['Revisa la próxima cita con tu adulto.','Sigue solo las indicaciones de tu equipo.','Comunica cualquier dificultad para regresar.']}
];
let selected=sessionStorage.getItem('miRutaHemaPatient')||'', lastDate='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>!v?'Aún no registrada':new Intl.DateTimeFormat('es-PE',{day:'numeric',month:'long',year:'numeric'}).format(new Date(v+'T12:00:00'));
const status=(i,idx)=>i<idx?'done':i===idx?'current':'';

function login(){
  const patients=RutaHemaData.patients();
  $('#app').innerHTML=`<section id="login" class="passport"><div class="eyebrow">Acceso demostrativo</div><h1>Abre tu pasaporte de cuidado</h1><p class="muted">Ingresa el código ficticio del paciente para consultar la ruta, acompañar sus avances y configurar la experiencia infantil.</p><label for="code">Código de paciente</label><input id="code" type="text" placeholder="Ej.: H-002" value="${esc(selected)}"><button id="enter" style="width:100%">Abrir mi bitácora</button><p class="notice"><b>Prueba sugerida:</b> H-002 muestra la encuesta ámbar. Códigos: ${patients.slice(0,6).map(p=>p.code).join(' · ')}.</p></section>`;
  $('#enter').onclick=()=>{const c=$('#code').value.trim().toUpperCase();if(!RutaHemaData.patientState(c)){alert('Código no encontrado. Usa uno de los códigos de demostración.');return}selected=c;sessionStorage.setItem('miRutaHemaPatient',c);render()};
}

function render(){
  const s=RutaHemaData.patientState(selected);if(!s){login();return}
  const {p,appointment,novedades,riskLevel,latestSurvey}=s, band=RutaHemaData.ageBand(p.edad), pct=Math.round((p.faseIdx/(phases.length-1))*100), next=phases[Math.min(p.faseIdx+1,phases.length-1)];
  if(lastDate&&lastDate!==p.proximaCita&&!novedades.some(n=>n.text.includes('cita ha sido actualizada')))novedades.unshift({text:'Tu próxima cita ha sido actualizada.',at:new Date().toISOString()});lastDate=p.proximaCita||'';
  document.body.dataset.age=band.id;
  const watched=(p.learning&&p.learning.watchedVideos)||[];
  $('#app').innerHTML=`
    <p class="muted">Pasaporte <b>${p.code}</b> · Datos ficticios <button class="secondary" id="change" style="float:right;padding:6px 10px;font-size:12px">Cambiar</button></p>
    <section class="passport"><div class="identity"><div class="photo">${p.selectedAvatar==='tuntung'?'🪵':'🦁'}</div><div><div class="eyebrow">República de los valientes</div><div class="code">${p.code}</div><div class="facts"><span class="chip">${p.edad} años</span><span class="chip">${band.label} · ${band.range}</span><span class="chip coin">🪙 ${p.wallet.coins} monedas</span></div></div><div class="stamp">Ruta Hema<br>${pct}%<br>recorrido</div></div></section>
    ${riskLevel==='Ámbar'?`<section class="card risk"><div class="eyebrow" style="color:var(--amber)">Acompañamiento preventivo</div><h2>Queremos ayudarte a continuar</h2><p>Tu ruta presenta señales operativas de riesgo moderado. Esta breve encuesta permite que el equipo conozca barreras de traslado, tiempo, información o apoyo.</p>${latestSurvey?`<span class="tag">✓ Encuesta enviada · ${new Date(latestSurvey.at).toLocaleDateString('es-PE')}</span><div class="buttons"><button class="outline" id="survey">Actualizar respuestas</button></div>`:`<button id="survey">Completar encuesta de continuidad</button>`}</section>`:''}
    <div class="grid"><section class="card hero"><div class="eyebrow">Sello actual de mi ruta</div><div class="step">${phases[p.faseIdx]}</div><div class="progress"><i style="width:${pct}%"></i></div><p style="margin:8px 0 0">${pct}% del recorrido registrado</p></section><section class="card"><h2>Próxima cita</h2><div class="appointment"><div class="icon">🗓</div><div><b>${date(appointment&&appointment.fecha)}</b><br><span class="muted">${appointment?`${esc(appointment.hora||'Hora por confirmar')} · ${esc(appointment.tipo||'Atención programada')}`:'El equipo registrará la siguiente atención.'}</span></div></div>${appointment?'<p class="notice">Confirma el horario con el equipo. Llegar a tiempo puede sumar monedas al pasaporte infantil.</p>':''}</section></div>
    <section class="card"><div class="eyebrow">Próxima página</div><h2>${next}</h2><p class="muted">Revisa la indicación del equipo y comunica con anticipación cualquier dificultad para asistir.</p><div class="buttons"><button id="route">Ver sellos de mi ruta</button><button class="secondary" id="help">Necesito ayuda</button><a class="btn outline" href="../../leos-adventure-2/dist/?patient=${p.code}">Abrir experiencia infantil</a></div></section>
    <section class="passport" id="routeCard" hidden><div class="eyebrow">Visas y sellos</div><h2>Mi ruta de atención</h2><ol class="route">${phases.map((x,i)=>`<li class="${status(i,p.faseIdx)}"><b>${x}</b>${i===p.faseIdx?'<br><span class="tag">Sello actual</span>':''}${i===p.faseIdx+1?'<br><span class="muted">Próximo destino</span>':''}</li>`).join('')}</ol></section>
    <section class="card"><div class="eyebrow">Biblioteca para todas las edades</div><h2>Videos: conozco mi tratamiento</h2><p class="muted">Guías demostrativas adaptadas al lenguaje de ${band.label.toLowerCase()}. El contenido clínico final se reemplazará por los enlaces aprobados por el equipo.</p><div class="library">${videos.map(v=>`<article class="media"><div class="cover">${v.icon}</div><h3>${v.title}</h3><p>${v.text}</p><button class="${watched.includes(v.id)?'secondary':''}" data-video="${v.id}">${watched.includes(v.id)?'✓ Ver otra vez':'Reproducir guía'}</button></article>`).join('')}</div></section>
    <section class="card"><div class="eyebrow">Zona del adulto responsable</div><h2>Control parental</h2><p class="muted">Estos ajustes se comparten con la experiencia infantil de ${p.code}.</p><div class="parent-grid"><label class="control"><span><b>Permitir juegos</b><br><small class="muted">Acceso a juegos educativos</small></span><input id="pcGames" type="checkbox" ${p.parentalControls.gamesAllowed?'checked':''}></label><label class="control"><span><b>Aprobar compras</b><br><small class="muted">Pide confirmación para usar monedas</small></span><input id="pcBuy" type="checkbox" ${p.parentalControls.purchasesRequireApproval?'checked':''}></label><label class="control"><span><b>Recordatorios de citas</b><br><small class="muted">Mostrar avisos en la app infantil</small></span><input id="pcReminders" type="checkbox" ${p.parentalControls.showAppointmentReminders?'checked':''}></label><label class="control"><span><b>Tiempo de juego diario</b></span><select id="pcMinutes" style="width:105px"><option value="15" ${p.parentalControls.dailyGameMinutes===15?'selected':''}>15 min</option><option value="20" ${p.parentalControls.dailyGameMinutes===20?'selected':''}>20 min</option><option value="30" ${p.parentalControls.dailyGameMinutes===30?'selected':''}>30 min</option></select></label></div><div class="buttons"><button id="saveControls">Guardar control parental</button></div></section>
    <section class="card"><h2>Novedades de la bitácora</h2>${novedades.length?novedades.slice(0,6).map(n=>`<div class="news">${esc(n.text)}<br><span class="muted">${new Date(n.at).toLocaleDateString('es-PE')}</span></div>`).join(''):'<p class="muted">No hay novedades. Los avances del niño, la familia y el equipo aparecerán aquí.</p>'}</section>
    <p class="notice">Prototipo local con datos sintéticos. No sustituye indicaciones médicas. En producción requiere autenticación, API segura y autorización institucional.</p>`;
  $('#change').onclick=()=>{selected='';sessionStorage.removeItem('miRutaHemaPatient');login()};
  $('#route').onclick=()=>{$('#routeCard').hidden=!$('#routeCard').hidden;if(!$('#routeCard').hidden)$('#routeCard').scrollIntoView({behavior:'smooth'})};
  $('#help').onclick=help;
  if($('#survey'))$('#survey').onclick=survey;
  document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>videoPlayer(b.dataset.video));
  $('#saveControls').onclick=()=>{RutaHemaData.saveParentalControls(selected,{gamesAllowed:$('#pcGames').checked,purchasesRequireApproval:$('#pcBuy').checked,showAppointmentReminders:$('#pcReminders').checked,dailyGameMinutes:+$('#pcMinutes').value});alert('Control parental guardado y sincronizado.');render()};
}

function videoPlayer(id){
  const v=videos.find(x=>x.id===id), band=RutaHemaData.ageBand(RutaHemaData.patientState(selected).p.edad);
  $('#sheet').innerHTML=`<div class="eyebrow">Video guía · ${band.label}</div><h2>${v.title}</h2><div class="video-player" id="player"><div><button class="play" id="play" aria-label="Reproducir">▶</button><b id="slide">${v.slides[0]}</b><div class="video-progress"><i></i></div></div></div><p class="muted">Recurso demostrativo sin indicaciones clínicas. Los videos finales se conectarán al material validado por el servicio.</p><div class="buttons"><button class="secondary" id="cancel">Cerrar</button><button id="complete" disabled>Marcar como visto</button></div>`;
  openModal();let idx=0,timer=null;$('#play').onclick=()=>{if(timer)return;$('#player').classList.add('playing');$('#play').textContent='❚❚';timer=setInterval(()=>{idx++;if(idx>=v.slides.length){clearInterval(timer);timer=null;$('#slide').textContent='Fin de la guía · ¡Puedes volver a verla!';$('#complete').disabled=false;$('#play').textContent='↻';return}$('#slide').textContent=v.slides[idx]},850)};$('#complete').onclick=()=>{RutaHemaData.recordLearning(selected,'video',id);close();render()};$('#cancel').onclick=()=>{if(timer)clearInterval(timer);close()};
}

function survey(){
  const qs=[['transporte','¿Tienen dificultad para llegar al hospital?'],['economia','¿Los gastos dificultan asistir a la próxima cita?'],['informacion','¿Necesitan que el equipo explique nuevamente algún paso?'],['tiempo','¿El horario de la cita es difícil de cumplir?'],['apoyo','¿Necesitan apoyo familiar o de Servicio Social?']];
  $('#sheet').innerHTML=`<div class="eyebrow" style="color:var(--amber)">Riesgo ámbar</div><h2>Encuesta de continuidad</h2><p class="muted">No evalúa el estado clínico. Ayuda a detectar barreras para continuar el tratamiento.</p>${qs.map(([id,q])=>`<div class="question"><label for="q-${id}"><b>${q}</b></label><select id="q-${id}"><option>No</option><option>Sí</option><option>No estoy seguro/a</option></select></div>`).join('')}<div class="question"><label for="q-comentario"><b>¿Hay algo más que el equipo deba saber?</b></label><textarea id="q-comentario" rows="3" placeholder="Escribe solo información necesaria; no incluyas DNI ni otros datos sensibles."></textarea></div><div class="buttons"><button class="secondary" id="cancel">Cancelar</button><button id="sendSurvey">Enviar al equipo</button></div>`;
  openModal();$('#cancel').onclick=close;$('#sendSurvey').onclick=()=>{const answers=Object.fromEntries(qs.map(([id])=>[id,$('#q-'+id).value]));answers.comentario=$('#q-comentario').value.trim();RutaHemaData.submitAmberSurvey(selected,answers);close();render();alert('Encuesta enviada al equipo de continuidad.')};
}

function help(){
  let choice='';const options=['No puedo asistir a la cita','Tengo dificultad de transporte','Necesito orientación','Tengo una dificultad familiar','Necesito comunicarme con el equipo','Otro'];
  $('#sheet').innerHTML=`<h2>¿Tienes alguna dificultad?</h2><p class="muted">Tu mensaje será registrado para revisión del equipo de continuidad.</p><div class="choices">${options.map(x=>`<button class="choice" data-v="${x}">${x}</button>`).join('')}</div><label for="detail" class="muted" style="display:block;margin-top:14px">Cuéntanos un poco más (opcional)</label><textarea id="detail" rows="3" placeholder="Ej.: necesito apoyo para el traslado"></textarea><div class="buttons"><button class="secondary" id="cancel">Cancelar</button><button id="send" disabled>Enviar solicitud</button></div>`;
  openModal();document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{choice=b.dataset.v;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('#send').disabled=false});$('#cancel').onclick=close;$('#send').onclick=()=>{RutaHemaData.reportBarrier(selected,choice,$('#detail').value.trim());close();render();alert('Solicitud enviada. El equipo podrá verla en Ruta Hema Profesional.')};
}
function openModal(){$('#modal').classList.add('show')}function close(){$('#modal').classList.remove('show')}
RutaHemaData.subscribe(e=>{if((e.key==='rutahema_v1'||e.type==='rutahema:changed')&&selected)render()});
login();if(selected)render();
</script>
</body>
</html>
